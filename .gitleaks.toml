# Secret scanning (CI runs `gitleaks git`). The default rules, minus values that are invented for tests:
# fake API keys used to prove that logs scrub secrets, and the sample WebSocket key from RFC 6455.
[extend]
useDefault = true

[[allowlists]]
description = "Invented test values, not real secrets"
regexes = [
  '''sk-live-ABCDEF123456''', '''sk-test-1234567890''', '''dGhlIHNhbXBsZSBub25jZQ==''',
  # Pasted-key and ChatGPT-token stand-ins in the setup and sign-in tests.
  '''sk-(?:pasted|other)-123456''', '''sk-never-logged-987''', '''(?:at|rt)-(?:fresh|once|second|winner)-123456''',
]

[[allowlists]]
description = "Placeholder token in the vendored Scrapling skill's docs (.claude/skills/scrapling-official/references/mcp-server.md)"
regexTarget = "line"
regexes = ['''SCRAPLING_MCP_AUTH_TOKEN="<your-token>"''']
