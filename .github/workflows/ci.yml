name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Chromium first: browser, blocker and engine unit tests launch it too.
      - run: pnpm exec playwright install --with-deps chromium
      # Scrapling reads job pages (web discovery, Add by link): its tests, the integration tests and E2E need it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Scrapling
        run: |
          python -m venv .scrapling/venv
          .scrapling/venv/bin/pip install -r python/requirements.txt pytest
          .scrapling/venv/bin/python -m playwright install --with-deps chromium
      - run: .scrapling/venv/bin/pytest -q python/tests
      - run: pnpm test
      - name: Quality gates (offline evals)
        run: |
          pnpm eval:matching --offline
          pnpm eval:tailoring --offline
          pnpm eval:inbox --offline
      - run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI (free for any repository; the GitHub Action needs a licence key for organisation repos).
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
