name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste personal data** (CV text, email addresses, tokens) and never your `.env`.
        Security problems: use Security → Report a vulnerability instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …  2. Click …  3. See …"
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Error details
      description: The reason shown in the app, the System page, or the terminal log (remove anything personal).
      render: text
  - type: dropdown
    id: install
    attributes:
      label: How do you run Job Scraper?
      options: [Native (pnpm start), Native (pnpm dev), Docker]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Job Scraper commit/tag, OS, Node version, AI provider (if any)"
