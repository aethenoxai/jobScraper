name: Feature request
description: An idea to make Job Scraper more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project's principles
      options:
        - label: Keeps every application behind the user's approval, CVs truthful, and data on the user's computer
          required: true
